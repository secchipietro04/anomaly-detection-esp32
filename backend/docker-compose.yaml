# full stack: emqx, timescaledb, backend worker, fastapi, grafana, clearml
version: "3.9"

services:

  # --- timescaledb ---
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tsdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emqx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emqx}
      POSTGRES_DB: ${POSTGRES_DB:-emqx}
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emqx} -d ${POSTGRES_DB:-emqx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- emqx mqtt broker ---
  emqx:
    image: emqx/emqx:5.7.0
    container_name: emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: "127.0.0.1"
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- mqtt ingestion worker ---
  backend_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_worker
    restart: unless-stopped
    command: python main.py
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-emqx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emqx}
      POSTGRES_DB: ${POSTGRES_DB:-emqx}
      MQTT_BROKER: emqx
      MQTT_PORT: 1883
      NAS_DATA_THRESHOLD_BYTES: 1048576
      RAM_LIMIT_BYTES: 4194304
      CLEARML_API_HOST: http://clearml_server:8008
      CLEARML_WEB_HOST: http://clearml_server:8080
      CLEARML_FILES_HOST: http://clearml_server:8081
      CLEARML_ACCESS_KEY: ${CLEARML_ACCESS_KEY:-}
      CLEARML_SECRET_KEY: ${CLEARML_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy

  # --- fastapi rest api ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_api
    restart: unless-stopped
    command: uvicorn app.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-emqx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emqx}
      POSTGRES_DB: ${POSTGRES_DB:-emqx}
      MQTT_BROKER: emqx
      MQTT_PORT: 1883
      CLEARML_API_HOST: http://clearml_server:8008
      CLEARML_ACCESS_KEY: ${CLEARML_ACCESS_KEY:-}
      CLEARML_SECRET_KEY: ${CLEARML_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- grafana ---
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  # --- clearml server (apiserver + webserver + fileserver) ---
  clearml_elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: clearml_es
    restart: unless-stopped
    environment:
      xpack.security.enabled: "false"
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - clearml_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  clearml_mongo:
    image: mongo:7.0
    container_name: clearml_mongo
    restart: unless-stopped
    volumes:
      - clearml_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  clearml_server:
    image: allegroai/clearml:1.16.0
    container_name: clearml_server
    restart: unless-stopped
    ports:
      - "8008:8008"
      - "8080:80"
      - "8081:8081"
    environment:
      CLEARML_SERVER_DEPLOYMENT_TYPE: "single"
      CLEARML_ELASTIC_SERVICE_HOST: clearml_elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: clearml_mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
    volumes:
      - clearml_data:/opt/clearml/data
      - clearml_logs:/opt/clearml/logs
    depends_on:
      clearml_elasticsearch:
        condition: service_healthy
      clearml_mongo:
        condition: service_healthy


volumes:
  tsdb_data:
  emqx_data:
  emqx_log:
  grafana_data:
  clearml_es_data:
  clearml_mongo_data:
  clearml_data:
  clearml_logs:
