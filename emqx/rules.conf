log {
    console {
        level = warning
    }
}



dashboard {
    listeners {
        http.bind = 18083
        # https.bind = 18084
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}


actions {
  pgsql {
    bridge_sensor_settings {
      connector = "postgres_conn"
      enable = true
      parameters {
        sql = "INSERT INTO \"sensor\" (\"id\", \"settings\") VALUES (${sensor_id}, ${settings}) ON CONFLICT (\"id\") DO UPDATE SET \"settings\" = EXCLUDED.\"settings\";"
      }
    }
    bridge_ensemble {
      connector = "postgres_conn"
      enable = true
      parameters {
        sql = "INSERT INTO \"ensemble\" (\"id\", \"timestamp_training_date\", \"type\", \"sensibility\") VALUES (${ensemble_id}, ${training_date}::timestamp, ${type}, ${sensibility}) ON CONFLICT (\"id\") DO UPDATE SET \"timestamp_training_date\" = EXCLUDED.\"timestamp_training_date\", \"type\" = EXCLUDED.\"type\", \"sensibility\" = EXCLUDED.\"sensibility\";"
      }
    }
    bridge_models {
      connector = "postgres_conn"
      enable = true
      parameters {
        sql = "INSERT INTO \"model\" (\"id\", \"info\", \"model_data\") VALUES (${model_id}, ${info}, ${model_data}::bytea) ON CONFLICT (\"id\") DO UPDATE SET \"info\" = EXCLUDED.\"info\", \"model_data\" = EXCLUDED.\"model_data\";"
      }
    }
    bridge_schema {
      connector = "postgres_conn"
      enable = true
      parameters {
        sql = "INSERT INTO \"datapoint_schema\" (\"schema_name\", \"description\", \"definition\") VALUES (${schema_name}, ${description}, ${definition}) ON CONFLICT (\"schema_name\") DO UPDATE SET \"description\" = EXCLUDED.\"description\", \"definition\" = EXCLUDED.\"definition\";"
      }
    }
    bridge_datapoint {
      connector = "postgres_conn"
      enable = true
      parameters {
        sql = "INSERT INTO \"datapoint\" (\"id\", \"from_time\", \"to_time\", \"sensor_id\", \"datapoint_schema\", \"data\") VALUES (${id}, ${from_time}::timestamp, ${to_time}::timestamp, ${sensor_id}, ${datapoint_schema}, ${data}) ON CONFLICT (\"id\") DO NOTHING;"
      }
    }
    bridge_result {
      connector = "postgres_conn"
      enable = true
      parameters {
        sql = "INSERT INTO \"result\" (\"timestamp\", \"score\", \"alert\", \"sensor_id\", \"model_id\") VALUES (${timestamp}::timestamp, ${score}, ${alert}, ${sensor_id}, ${model_id}) ON CONFLICT (\"sensor_id\", \"model_id\", \"timestamp\") DO UPDATE SET \"score\" = EXCLUDED.\"score\", \"alert\" = EXCLUDED.\"alert\";"
      }
    }
  }
}

rule_engine {
  rules {
    rule_sensor_settings {
      actions = ["pgsql:bridge_sensor_settings"]
      enable = true
      sql = "SELECT payload.settings AS settings, str_to_int(nth(2, split(topic, '/'))) AS sensor_id FROM \"sensors/+/settings\""
    }

    rule_ensemble {
      actions = ["pgsql:bridge_ensemble"]
      enable = true
      sql = "SELECT payload.ensemble_id AS ensemble_id, payload.training_date AS training_date, payload.type AS type, payload.sensibility AS sensibility FROM \"sensors/+/ensemble\""
    }

    rule_models {
      actions = ["pgsql:bridge_models"]
      enable = true
      sql = "FOREACH payload.models DO item.id AS model_id, item.info AS info, item.model_data AS model_data FROM \"sensors/+/ensemble\""
    }

    rule_schema {
      actions = ["pgsql:bridge_schema"]
      enable = true
      sql = "SELECT payload.schema_name AS schema_name, payload.description AS description, payload.definition AS definition FROM \"sensors/+/schema\""
    }

    rule_datapoint {
      actions = ["pgsql:bridge_datapoint"]
      enable = true
      sql = "FOREACH CASE WHEN is_list(payload) THEN payload ELSE [payload] END DO str_to_int(nth(2, split(topic, '/'))) AS sensor_id, item.id AS id, item.from_time AS from_time, item.to_time AS to_time, item.datapoint_schema AS datapoint_schema, item.data AS data FROM \"sensors/+/datapoints\""
    }

    rule_result {
      actions = ["pgsql:bridge_result"]
      enable = true
      sql = "FOREACH CASE WHEN is_list(payload) THEN payload ELSE [payload] END DO str_to_int(nth(2, split(topic, '/'))) AS sensor_id, item.timestamp AS timestamp, item.score AS score, item.alert AS alert, item.model_id AS model_id FROM \"sensors/+/results\""
    }
  }
}