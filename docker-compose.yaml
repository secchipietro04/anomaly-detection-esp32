include:
  - docker-compose.clearml.yaml

services:

  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: tsdb
    restart: "on-failure:5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emqx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emqx}
      POSTGRES_DB: ${POSTGRES_DB:-emqx}
    ports:
      - "30932:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "emqx", "-d", "emqx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge-ai-network

  emqx:
    image: emqx/emqx:5.7.0
    container_name: emqx
    restart: "on-failure:5"
    ports:
      - "1883:1883"
      - "8083:8083"
      - "30983:18083"
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: "127.0.0.1"
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - edge-ai-network

  mqtt_service:
    build:
      context: .
      dockerfile: backend/app/mqtt/Dockerfile
    container_name: mqtt_service
    restart: "on-failure:5"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-emqx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emqx}
      POSTGRES_DB: ${POSTGRES_DB:-emqx}
      MQTT_BROKER: emqx
      MQTT_PORT: 1883
      CLEARML_API_HOST: http://clearml_apiserver:8008
      CLEARML_WEB_HOST: http://clearml_webserver:80
      CLEARML_FILES_HOST: http://clearml_fileserver:8081
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - edge-ai-network

  api_service:
    build:
      context: .
      dockerfile: backend/app/api/Dockerfile
    container_name: api_service
    restart: "on-failure:5"
    ports:
      - "30900:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-emqx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emqx}
      POSTGRES_DB: ${POSTGRES_DB:-emqx}
      MQTT_BROKER: emqx
      MQTT_PORT: 1883
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - edge-ai-network

  nas_service:
    build:
      context: .
      dockerfile: backend/app/nas/Dockerfile
    container_name: nas_service
    restart: "on-failure:5"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-emqx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emqx}
      POSTGRES_DB: ${POSTGRES_DB:-emqx}
      MQTT_BROKER: emqx
      MQTT_PORT: 1883
      CLEARML_API_HOST: http://clearml_apiserver:8008
      CLEARML_WEB_HOST: http://clearml_webserver:80
      CLEARML_FILES_HOST: http://clearml_fileserver:8081
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - edge-ai-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: "on-failure:5"
    ports:
      - "30930:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge-ai-network

volumes:
  tsdb_data:
  emqx_data:
  emqx_log:
  grafana_data:

networks:
  edge-ai-network:
    name: edge-ai-network
    driver: bridge
